dow:0 0 0 2px #d1c5e7}.color-dot.selected{box-shadow:0 0 0 4px #6f53c9}.clock-face{width:155px;height:155px;border:8px solid #eecb69;border-radius:50%;background:#fff;position:relative;box-shadow:inset 0 0 0 5px #fff3cb}.clock-face .num{position:absolute;font-weight:1000;color:#654c91;font-size:16px;transform:translate(-50%,-50%)}.clock-hand{position:absolute;width:5px;height:48px;left:50%;top:50%;transform-origin:50% 0;background:#6948bd;border-radius:6px;transform:rotate(0deg)}.clock-center{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#f3b93e;transform:translate(-50%,-50%)}

/* ===== AVENTURA DO SABER 2.0 · visual system ===== */
:root{--ink:#211b43;--purple:#6a4ce1;--pink:#f16da9;--blue:#36b9ea;--yellow:#ffd35f;--green:#43c98b;--paper:#fffdf6;--soft:#f1edff;--shadow:0 24px 70px rgba(10,8,46,.28);--focus:#ffcf4a;--surface:#ffffff;--muted:#756d91}

button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.map-shell{min-height:100vh;align-items:flex-start;padding:clamp(12px,2.2vw,30px)}

/* === MODO IMERSIVO PAISAGEM: GitHub Pages / mobile browsers === */
html, body {
  width:100%; height:100%; min-height:100%; margin:0;
  overscroll-behavior:none; overflow:hidden !important;
}
body { min-height:100dvh; }
#app { width:100vw; height:100vh; height:100dvh; min-height:0; padding:0 !important; }
.map-shell.immersive-shell {
  position:fixed !important; inset:0 !important;
  width:100vw !important; height:100vh !important; height:100dvh !important;
  min-height:0 !important; padding:0 !important; margin:0 !important;
  display:block !important; overflow:hidden !important;
  background:#07164e;
}
.fullscreen-world { position:absolute; inset:0; overflow:hidden; background:#07164e; }
.map-shell.immersive-shell .map-stage {
  position:absolute !important; left:50% !important; top:50% !important;
  width:max(100vw,177.7778vh) !important;
  height:max(100vh,56.25vw) !important;
  max-width:none !important; max-height:none !important;
  aspect-ratio:16 / 9 !important; flex:none !important;
  transform:translate(-50%,-50%) !important;
  box-shadow:none !important;
}
@supports (height:100dvh) {
  .map-shell.immersive-shell .map-stage {
    width:max(100vw,177.7778dvh) !important;
    height:max(100dvh,56.25vw) !important;
  }
}
.map-shell.immersive-shell .map-art {
  position:absolute !important; inset:0 !important;
  display:block !important; width:100% !important; height:100% !important;
  object-fit:fill !important; user-select:none; pointer-events:none;
}
.map-shell.immersive-shell .hotspot {
  border:0; padding:0; border-radius:24%; background:transparent;
  cursor:pointer; touch-action:manipulation;
}
.map-shell.immersive-shell .hotspot:hover,
.map-shell.immersive-shell .hotspot:focus-visible {
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 3px rgba(255,241,151,.95),0 0 28px rgba(255,218,75,.45);
}
/* Hotspots correspond to the six illustrated islands. */
#hs-dino   {left:1.2% !important; top:5.5% !important; width:29.5% !important; height:38.5% !important;}
#hs-letters{left:30.8% !important;top:5.2% !important; width:34.2% !important; height:39.5% !important;}
#hs-city   {left:65.1% !important;top:4.5% !important; width:33.7% !important; height:39.0% !important;}
#hs-galaxy {left:1.0% !important; top:45.0% !important;width:28.0% !important; height:47.0% !important;}
#hs-ocean  {left:29.1% !important;top:48.0% !important;width:38.8% !important; height:50.0% !important;}
#hs-art    {left:68.0% !important;top:45.0% !important;width:31.0% !important; height:49.0% !important;}
.map-shell.immersive-shell .hotspot .tip { display:none !important; }
.world-label {
  position:absolute; left:50%; transform:translateX(-50%);
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  max-width:94%; white-space:nowrap; pointer-events:none;
  padding:clamp(5px,.65vw,10px) clamp(8px,1.0vw,15px);
  border:1.5px solid rgba(255,255,255,.88); border-radius:999px;
  color:#fff; background:rgba(30,22,83,.80);
  box-shadow:0 4px 14px rgba(7,10,44,.28),inset 0 1px 0 rgba(255,255,255,.25);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  font-size:clamp(9px,.95vw,15px); font-weight:1000; letter-spacing:.005em;
  text-shadow:0 1px 3px rgba(0,0,0,.6); transition:transform .18s,background .18s;
}
.hotspot:hover .world-label,.hotspot:focus-visible .world-label { transform:translateX(-50%) scale(1.06); background:rgba(77,48,157,.94); }
#hs-dino .world-label,#hs-letters .world-label,#hs-city .world-label {top:80%;}
#hs-galaxy .world-label,#hs-ocean .world-label,#hs-art .world-label {top:82%;}
.fullscreen-hud {
  position:absolute; z-index:7; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:clamp(8px,1.15vw,17px) clamp(10px,1.45vw,22px);
  pointer-events:none;
}
.brand-chip,.hud-tools,.journey-chip { pointer-events:auto; }
.brand-chip {
  display:flex; align-items:center; gap:9px; min-width:0;
  padding:8px 13px 8px 9px; border:1px solid rgba(255,255,255,.62);
  border-radius:17px; background:rgba(16,24,79,.78); color:#fff;
  box-shadow:0 5px 18px rgba(4,8,41,.22); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.brand-chip .brand-icon { width:31px;height:31px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#ffe889,#ffb641);font-size:19px; }
.brand-chip strong { display:block; font-size:clamp(12px,1.1vw,17px);line-height:1.05;white-space:nowrap; }
.brand-chip small { display:block;margin-top:2px;color:#dce8ff;font-size:clamp(8px,.68vw,10px);font-weight:850;letter-spacing:.08em; }
.hud-tools { display:flex; align-items:center; justify-content:flex-end; gap:clamp(4px,.55vw,8px); flex-wrap:nowrap; }
.hud-tools .ui-action {
  display:flex; align-items:center; justify-content:center; gap:7px;
  min-height:40px; padding:8px 11px; border:1px solid rgba(255,255,255,.64);
  border-radius:14px; background:rgba(16,24,79,.80); color:white;
  box-shadow:0 4px 15px rgba(4,8,41,.20); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  font-size:clamp(11px,.82vw,13px); font-weight:950; white-space:nowrap;
  touch-action:manipulation; transition:transform .15s,background .15s;
}
.hud-tools .ui-action:hover,.hud-tools .ui-action:focus-visible {background:rgba(78,55,157,.95);transform:translateY(-1px);}
.hud-tools .ui-action .ui-icon {font-size:18px;line-height:1;}
.hud-tools .fullscreen-action { background:linear-gradient(150deg,#ffe17b,#ffb638);color:#573c00;border-color:#fff1ad; }
.journey-chip {
  position:absolute; z-index:7; left:50%; bottom:clamp(8px,1.4vw,20px); transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; max-width:calc(100vw - 24px);
  padding:8px 15px; border:1px solid rgba(255,255,255,.62); border-radius:999px;
  color:#fff; background:rgba(15,25,78,.78); box-shadow:0 5px 18px rgba(4,8,41,.24);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  font-size:clamp(10px,.85vw,13px); font-weight:950; white-space:nowrap;
}
.journey-chip .journey-progress {width:clamp(58px,8vw,120px);height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.25);}
.journey-chip .journey-progress span {display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd34f,#79e7ba);}
.mobile-world-section { display:none !important; }
.orientation-gate {
  display:none; position:fixed; z-index:1000; inset:0; align-items:center; justify-content:center;
  padding:26px; color:white; text-align:center;
  background:radial-gradient(ellipse at 50% 15%,#354cba 0%,#15154f 60%,#080c30 100%);
}
.orientation-card {width:min(440px,100%);padding:28px 24px;border:1px solid rgba(255,255,255,.23);border-radius:28px;background:rgba(255,255,255,.10);box-shadow:0 20px 70px rgba(0,0,0,.25);backdrop-filter:blur(14px);}
.orientation-symbol {font-size:56px;line-height:1.2;display:block;margin-bottom:12px;animation:rotate-hint 2.2s ease-in-out infinite;}
@keyframes rotate-hint {0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
.orientation-card h2 {margin:0 0 9px;font-size:25px;}
.orientation-card p {margin:0 auto 18px;max-width:330px;color:#e2e8ff;font-weight:700;line-height:1.5;}
.orientation-card button {border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(180deg,#ffe37a,#ffb83e);color:#573c00;font-weight:1000;box-shadow:0 4px 0 rgba(0,0,0,.15);}
@media (orientation:portrait) and (max-width:900px) {
  .orientation-gate {display:flex;}
}
@media (max-width:900px) and (orientation:landscape) {
  .brand-chip {padding:6px 9px;gap:6px;border-radius:13px;}
  .brand-chip .brand-icon {width:26px;height:26px;font-size:16px;border-radius:9px;}
  .brand-chip small {display:none;}
  .hud-tools {gap:4px;}
  .hud-tools .ui-action {min-height:34px;min-width:35px;padding:6px 8px;border-radius:11px;}
  .hud-tools .ui-action .ui-text {display:none;}
  .hud-tools .ui-action .ui-icon {font-size:17px;}
  .journey-chip {bottom:6px;padding:6px 11px;gap:7px;}
  .world-label {font-size:clamp(9px,1.25vw,12px);padding:5px 8px;}
}
@media (max-height:430px) and (orientation:landscape) {
  .fullscreen-hud {padding:6px 10px;}
  .brand-chip {padding:5px 8px;}
  .hud-tools .ui-action {min-height:31px;padding:5px 7px;}
  .journey-chip {bottom:5px;padding:5px 10px;font-size:9px;}
  .journey-chip .journey-progress {height:5px;}
}
@media (prefers-reduced-motion:reduce) {
  .orientation-symbol {animation:none;}
  .world-label,.hud-tools .ui-action {transition:none;}
}


.difficulty-pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#e7fff1;color:#20784e;font-size:10px;font-weight:1000;letter-spacing:.06em;border:1px solid #bcebd0}

/* Correção de interação: o aviso de orientação não deve bloquear as missões.
   Em retrato, apresenta-se um seletor de mundos grande e totalmente clicável. */
.portrait-world-menu{display:none}
.orientation-gate{display:none!important;pointer-events:none!important}
@media (orientation:portrait) and (max-width:900px){
 html,body,#app{width:100%;height:100%;min-height:100%;overflow:hidden}
 .map-shell.immersive-shell{display:block!important;width:100%!important;height:100dvh!important;min-height:100dvh!important;padding:0!important;overflow:hidden!important}
 .fullscreen-world{position:relative!important;inset:auto!important;width:100%!important;height:100dvh!important;min-height:100dvh!important;overflow:hidden!important;display:block!important;padding:0!important;background:radial-gradient(ellipse at 50% 0%,#5364c6 0%,#18235e 58%,#09133d 100%)!important}
 .map-shell.immersive-shell .map-stage{display:none!important}
 .portrait-world-menu{position:absolute;display:grid;z-index:6;left:14px;right:14px;top:82px;bottom:66px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow-y:auto;overscroll-behavior:contain;padding:8px 5px 12px;align-content:center}
 .portrait-world-card{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 8px;border:2px solid rgba(255,255,255,.82);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(235,229,255,.96));color:#392765;box-shadow:0 6px 0 rgba(4,8,50,.25),0 10px 24px rgba(0,0,0,.14);touch-action:manipulation;cursor:pointer}
 .portrait-world-card:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(4,8,50,.25)}
 .portrait-world-card span{font-size:clamp(29px,9vw,43px);line-height:1.1}
 .portrait-world-card strong{text-align:center;font-size:clamp(12px,3.5vw,15px);line-height:1.15}
 .portrait-world-card small{font-size:11px;font-weight:800;color:#796d9b}
 .fullscreen-hud{z-index:8;top:0;left:0;right:0;padding:7px 9px;gap:5px;align-items:center}
 .fullscreen-hud>.brand-chip{padding:5px 7px;gap:5px;border-radius:12px}
 .fullscreen-hud>.brand-chip .brand-icon{width:25px;height:25px;font-size:15px}
 .fullscreen-hud>.brand-chip strong{font-size:10px}
 .fullscreen-hud>.brand-chip small{display:none}
 .hud-tools{gap:4px;flex:1;justify-content:flex-end;flex-wrap:nowrap}
 .hud-tools>.brand-chip{display:none}
 .hud-tools .ui-action{min-width:34px;min-height:34px;padding:5px 7px;border-radius:10px}
 .hud-tools .ui-action .ui-text{display:none}
 .hud-tools .ui-action .ui-icon{font-size:16px}
 .journey-chip{z-index:8;bottom:8px!important;max-width:calc(100vw - 20px);padding:6px 10px;gap:7px;font-size:10px}
 .journey-chip .journey-progress{width:55px;height:6px}
}
</style>

 case 'pintor':return `<div class="game-area"><div class="helper-note">Modelo para copiar:</div><div class="paint-grid">${t.target.map(v=>`<div class="paint-cell" style="background:${v}"></div>`).join('')}</div><div class="helper-note">Sua pintura:</div><div class="paint-grid">${s.painted.map((v,i)=>`<button class="paint-cell" data-cell="${i}" style="background:${v||'#fff'}"></button>`).join('')}</div><div class="palette">${[['#ff5f75','Vermelho'],['#43b9ee','Azul'],['#65cb91','Verde'],['#ffd34f','Amarelo'],['#9a75e8','Roxo'],['#ff83c3','Rosa']].map(v=>`<button class="color-dot ${s.color===v[0]?'selected':''}" data-color="${v[0]}" style="background:${v[0]}" aria-label="${v[1]}"></button>`).join('')}</div><button class="primary-btn" data-action="paint-check">Conferir pintura</button></div>`;
 case 'geometria':return `<div class="game-area"><div class="selected-total">Escolha: ${s.selected.length} formas. A casinha precisa de ${t.need.length} peças.</div><div class="helper-note">Peças necessárias: ${t.need.map(x=>x==='triangle'?'triângulo':x==='square'?'quadrado':x==='circle'?'círculo':'retângulo').join(' + ')}</div><div class="choice-grid">${t.pieces.map((v,i)=>`<button class="choice-btn ${s.selected.includes(i)?'selected':''}" data-item="shape-${i}" style="min-height:65px">${v[1]}<small style="display:block;font-size:13px">${v[0]==='triangle'?'Triângulo':v[0]==='square'?'Quadrado':v[0]==='circle'?'Círculo':'Retângulo'}</small></button>`).join('')}</div><div class="action-row"><button class="primary-btn" data-action="shape-check">Construir</button><button class="secondary-btn" data-action="clear">Limpar</button></div></div>`;

function taskPrompt(id,t){
 const prompts={
  mercado:`Escolha produtos que somem exatamente ${t.target} moedas.`,alimentar:`Dê ao dinossauro exatamente ${t.n} ${t.food?.[1]||'maçãs'}.`,fabrica:`Monte a palavra ${t.word} usando as letras abaixo.`,silabas:`Monte a palavra ${t.word} colocando as sílabas na ordem.`,cartas:`Vire as cartas e encontre os ${(Array.isArray(t.pairs)?t.pairs.length:4)/2} pares iguais.`,labirinto:'Encontre o caminho até a bandeira usando as setas.',quebra:'Troque as peças de lugar para organizar a imagem.',ciclo:'Coloque as etapas na ordem em que acontecem.',eco:'Escute a sequência de sons e repita tocando nas cores.',ritmo:`Ouça a batida ${t.tempo>=450?'devagar':t.tempo>=350?'no ritmo normal':'bem rapidinha'} e toque no tambor ${t.n} vezes.`,pintor:'Escolha uma cor e pinte os quadradinhos para copiar o padrão.',geometria:'Escolha as formas necessárias para montar a casinha.',relogio:`Ajuste o relógio para ${t.hour} horas.`,supermercado:'Escolha todos os itens que aparecem na lista de compras.'
 };
 return prompts[id]||t.q||t.prompt||'Vamos brincar?';
}
function handleAction(action,value,index){
 if(ui.feedback&&!['continue','retry','voice','toggle-sound','toggle-voice'].includes(action))return;
 if(action==='voice'){announceTask();return;}
 if(action==='continue'){
  if(ui.round<2){ui.round++;ui.taskState=newTaskState(ui.game,ui.round);ui.feedback=null;renderGame();announceTask();}
  else finishRun();return;
 }
 if(action==='retry'){clearTaskTimers();ui.taskState=newTaskState(ui.game,ui.round);ui.feedback=null;renderGame();announceTask();return;}
 if(action==='clear'){
  const s=ui.taskState;
  if(ui.game==='mercado'||ui.game==='supermercado'||ui.game==='geometria')s.selected=[];
  else if(['fabrica','silabas','ciclo'].includes(ui.game))s.built=[];
  else if(ui.game==='eco'){s.input=[];s.playing=false;clearTaskTimers();}
  else if(ui.game==='pintor')s.painted=['','','',''];
  renderGame();return;
 }
 const t=activeTask(),s=ui.taskState;
 switch(action){
  case 'toggle-sound':data.sound=!data.sound;persist();renderGame();if(data.sound)tone(660,.12);break;
  case 'toggle-voice':data.voice=!data.voice;persist();renderGame();if(data.voice)announceTask();else if('speechSynthesis'in window)speechSynthesis.cancel();break;
  case 'count-plus':s.count=Math.min(12,s.count+1);renderGame();break;
  case 'count-minus':s.count=Math.max(0,s.count-1);renderGame();break;
  case 'count-check':s.count===t.n?correct('O dinossauro adorou! Você contou certinho!'):incorrect('Vamos contar mais uma vez. Quantas maçãs ele pediu?');break;
  case 'market-check':{const sum=s.selected.reduce((n,name)=>{const item=t.items.find(x=>x[1]===name);return n+(item?item[2]:0)},0);sum===t.target&&s.selected.length>0?correct('Compra perfeita! Você usou as moedas direitinho!'):incorrect('Confira os preços. A soma precisa ser exatamente '+t.target+' moedas.');break;}
  case 'build-check':{const word=ui.game==='fabrica'?s.built.map(i=>t.letters[i]).join(''):s.built.map(i=>t.pieces[i]).join('');word===t.word?correct('Palavra formada! Muito bem!'):incorrect('Leia devagar e tente organizar as peças novamente.');break;}
  case 'sequence-check':{const right=t.steps.map((_,i)=>i);JSON.stringify(s.built)===JSON.stringify(right)?correct('Você colocou tudo na ordem certa!'):incorrect('Pense no que acontece primeiro e tente novamente.');break;}
  case 'play-sequence':playSequence(t.seq);break;
  case 'play-rhythm':playRhythm(t.n,t.tempo);break;
  case 'drum':if(!s.started||s.playing){showToast('Primeiro escute a batida completa.');return;}s.taps++;tone(190,.16);if(s.taps===t.n)correct('Que ritmo maravilhoso!');else if(s.taps>t.n){s.taps=0;incorrect('Vamos ouvir e tentar de novo, sem pressa.');}else renderGame();break;
  case 'paint-check':JSON.stringify(s.painted)===JSON.stringify(t.target)?correct('Que pintura caprichada!'):incorrect('Compare as cores com o modelo e tente novamente.');break;
  case 'shape-check':{const chosen=s.selected.map(i=>t.pieces[i][0]).sort();const need=t.need.slice().sort();JSON.stringify(chosen)===JSON.stringify(need)?correct('A casinha ficou pronta!'):incorrect('Confira quantos triângulos, quadrados ou outras formas faltam.');break;}
  case 'clock-check':s.hour===t.hour?correct('Acertou a hora!'):incorrect('Mova o ponteiro até a hora indicada.');break;
  case 'basket-check':{const a=[...s.selected].sort(),b=[...t.list].sort();JSON.stringify(a)===JSON.stringify(b)?correct('Tudo o que estava na lista foi para a cestinha!'):incorrect('Confira a lista. Pegue todos os itens pedidos e deixe os outros na prateleira.');break;}
 }
}
function handleChoice(value){
 if(ui.feedback)return;
 const t=activeTask();let answer=ui.boss?t.a:t.a;
 if(ui.game==='detetive')answer=t.letter;
 if(ui.game==='naopertence'||ui.game==='moradia'||ui.game==='reciclagem'||ui.game==='visual')answer=t.a;
 if(ui.game==='diferencas')answer=String(t.a);
 if(String(value)===String(answer))correct('Muito bem! Você conseguiu! 🌟');else incorrect('Quase! Observe com atenção e tente mais uma vez.');
}
function handleTile(index){if(ui.feedback)return;const s=ui.taskState,t=activeTask();index=Number(index);if(s.built.includes(index))return;s.built.push(index);renderGame();}
function toggleItem(name){if(ui.feedback)return;const s=ui.taskState,t=activeTask();if(name.startsWith('shape-')){const i=Number(name.split('-')[1]);s.selected=s.selected.includes(i)?s.selected.filter(x=>x!==i):[...s.selected,i];renderGame();return;}if(ui.game==='mercado'||ui.game==='supermercado'){s.selected=s.selected.includes(name)?s.selected.filter(x=>x!==name):[...s.selected,name];renderGame();}}
function handleCell(i){if(ui.feedback)return;const s=ui.taskState;s.painted[i]=s.color;renderGame();}
function handleColor(color){if(ui.feedback)return;ui.taskState.color=color;renderGame();}
function changeHour(delta){if(ui.feedback)return;ui.taskState.hour=((ui.taskState.hour-1+delta+12)%12)+1;renderGame();}
function addStep(i){if(ui.feedback)return;i=Number(i);if(ui.taskState.built.includes(i))return;ui.taskState.built.push(i);renderGame();}
function correct(msg){recordSkill(true);successSound();ui.feedback={good:true,text:msg||'Muito bem! Você conseguiu!'};renderGame();}
function incorrect(msg){recordSkill(false);softSound();ui.feedback={good:false,text:msg||'Vamos tentar novamente!'};renderGame();}
const BADGES=[
 {id:'primeira',icon:'🌟',name:'Primeira descoberta',desc:'Conclua sua primeira missão.',test:()=>data.completed.length>=1},
 {id:'explorador',icon:'🧭',name:'Grande explorador',desc:'Conclua 6 missões diferentes.',test:()=>data.completed.length>=6},
 {id:'colecionador',icon:'🏅',name:'Colecionador',desc:'Conclua 12 missões diferentes.',test:()=>data.completed.length>=12},
 {id:'leitor',icon:'📚',name:'Amigo das palavras',desc:'Conclua as 4 missões do Reino das Letras.',test:()=>worldById('letters').games.every(g=>data.completed.includes(g[0]))},
 {id:'cientista',icon:'🔬',name:'Pequeno cientista',desc:'Conclua as 4 missões do Oceano do Conhecimento.',test:()=>worldById('ocean').games.every(g=>data.completed.includes(g[0]))},
 {id:'chefao',icon:'👑',name:'Desafiador de chefões',desc:'Vença 3 chefões.',test:()=>data.bosses.length>=3},
 {id:'lenda',icon:'🏆',name:'Lenda do Saber',desc:'Conclua todas as missões e chefões.',test:()=>data.completed.length===24&&data.bosses.length===6}
];
function unlockBadges(){const newly=[];for(const b of BADGES){if(!data.badges.includes(b.id)&&b.test()){data.badges.push(b.id);newly.push(b);}}return newly;}
function finishRun(){
 const worldId=ui.boss?ui.game:gameMeta(ui.game).world.id;let earned=0,bonusXp=0,isReplay=false;
 const today=new Date().toLocaleDateString('en-CA');
 if(data.replayDay!==today){data.replayDay=today;data.replayXpToday=0;}
 data.plays++;
 if(ui.boss){if(!data.bosses.includes(worldId)){data.bosses.push(worldId);data.stars+=3;data.xp+=30;earned=3;}else{isReplay=true;if(data.replayXpToday<30){bonusXp=Math.min(5,30-data.replayXpToday);data.replayXpToday+=bonusXp;data.xp+=bonusXp;}}}
 else if(!data.completed.includes(ui.game)){data.completed.push(ui.game);data.stars+=1;data.xp+=10;earned=1;}
 else{isReplay=true;if(data.replayXpToday<30){bonusXp=Math.min(3,30-data.replayXpToday);data.replayXpToday+=bonusXp;data.xp+=bonusXp;}}
 const newBadges=unlockBadges();persist();renderResult(earned,newBadges,bonusXp,isReplay);
}
function renderResult(earned,newBadges=[],bonusXp=0,isReplay=false){
 const isBoss=ui.boss,worldId=isBoss?ui.game:gameMeta(ui.game).world.id,w=worldById(worldId),message=isBoss?'Você encarou o chefão e venceu!':'Missão concluída com sucesso!';
 const badgeHtml=newBadges.map(b=>`<div class="badge-unlock"><span style="font-size:24px">${b.icon}</span><span>Nova conquista: ${esc(b.name)}!</span></div>`).join('');
 const trailActive=Array.isArray(ui.trail),nextLabel=ui.trail?.length?`Próxima missão (${ui.trail.length} restantes) ▶`:'Concluir trilha 🌈';
 renderOverlay(`<section class="panel" tabindex="-1"><button class="close-btn" data-result-map aria-label="Voltar ao mapa">✕</button><div class="result-hero"><div class="result-emoji">${isBoss?'👑🏆':'🎉🌈'}</div><h2>${isBoss?'Chefão derrotado!':'Muito bem!'}</h2><p>${message} Você aprendeu brincando.</p><div class="result-stars">${earned?`+${earned} ⭐ ${earned===1?'estrela':'estrelas'}`:(bonusXp?`+${bonusXp} ✨ XP por jogar novamente`:'⭐ Recompensa principal já recebida; continue jogando para praticar!')}</div><p>Total: <strong>${data.stars} estrelas</strong> · <strong>${data.xp} XP</strong> · <strong>${data.plays} partidas</strong></p>${isReplay?'<p class="muted">Este desafio foi renovado com perguntas e combinações diferentes. Você pode jogar quantas vezes quiser!</p>':''}${badgeHtml}<div class="action-row">${trailActive?`<button class="primary-btn" data-result-next>${nextLabel}</button>`:`<button class="primary-btn" data-result-world>Voltar ao mundo</button>`}<button class="secondary-btn" data-result-map>Voltar ao mapa</button></div></div></section>`);
 const panel=$('#overlay').querySelector('.panel');panel.focus({preventScroll:true});
 if(trailActive)$('#overlay').querySelector('[data-result-next]').onclick=beginNextTrail;
 else $('#overlay').querySelector('[data-result-world]').onclick=()=>{ui.trail=null;ui.trailWorld=null;openWorld(w.id);};
 $('#overlay').querySelectorAll('[data-result-map]').forEach(b=>b.onclick=()=>{ui.trail=null;ui.trailWorld=null;closeOverlay();renderMap();});
}
function moveMaze(dir){const t=activeTask(),s=ui.taskState;let r=Math.floor(s.position/3),c=s.position%3;if(dir==='up')r--;if(dir==='down')r++;if(dir==='left')c--;if(dir==='right')c++;if(r<0||r>2||c<0||c>2)return;const pos=r*3+c;if(t.walls.includes(pos)){softSound();showToast('Tem uma pedra nesse caminho. Tente outra direção!');return;}s.position=pos;tone(330,.08);if(pos===t.goal)correct('Você encontrou a saída do labirinto!');else renderGame();}
function swapPuzzle(i){if(ui.feedback)return;const t=activeTask(),s=ui.taskState;if(!s.tiles)s.tiles=t.tiles.slice();if(s.first===null){s.first=i;renderGame();return;}const j=s.first;s.first=null;[s.tiles[i],s.tiles[j]]=[s.tiles[j],s.tiles[i]];if(JSON.stringify(s.tiles)===JSON.stringify(t.target))correct('Todas as peças estão no lugar!');else renderGame();}
function flipMemory(i){const t=activeTask(),s=ui.taskState;if(ui.feedback||s.flipped.includes(i)||s.matched.includes(i)||s.flipped.length>=2)return;s.flipped.push(i);tone(450,.08);if(s.flipped.length===2){const [a,b]=s.flipped;if(t.pairs[a]===t.pairs[b]){s.matched.push(a,b);s.flipped=[];if(s.matched.length===t.pairs.length){correct('Você encontrou todos os pares! Memória brilhante!');return;}renderGame();}else{renderGame();scheduleTask(()=>{if(!ui.feedback&&ui.game==='cartas'&&ui.taskState===s){s.flipped=[];renderGame();}},850);}}else renderGame();}
const PAD_FREQ={azul:440,verde:523,rosa:659,amarelo:784};
function playSequence(seq){const s=ui.taskState;clearTaskTimers();s.input=[];s.playing=true;renderGame();seq.forEach((color,i)=>scheduleTask(()=>tone(PAD_FREQ[color]||440,.22),i*440));scheduleTask(()=>{if(ui.taskState!==s)return;s.playing=false;renderGame();showToast('Agora é sua vez de repetir!');},seq.length*440+80);}
function tapPad(color){const t=activeTask(),s=ui.taskState;if(ui.feedback||s.playing)return;s.input.push(color);tone(PAD_FREQ[color]||440,.18);if(s.input.length===t.seq.length){JSON.stringify(s.input)===JSON.stringify(t.seq)?correct('Você repetiu a sequência todinha!'):incorrect('Escute mais uma vez e tente repetir.');}else if(s.input.length<t.seq.length)renderGame();}
function playRhythm(n,tempo=390){const s=ui.taskState;clearTaskTimers();s.started=false;s.playing=true;s.taps=0;renderGame();for(let i=0;i<n;i++)scheduleTask(()=>tone(i%2?360:220,.16),i*tempo);scheduleTask(()=>{if(ui.taskState!==s)return;s.playing=false;s.started=true;renderGame();showToast('Sua vez! Toque no tambor no mesmo ritmo.');},n*tempo+180);}

function openProgress(){
 const completed=data.completed.length,boss=data.bosses.length,level=levelInfo();
 const rows=worlds.map(w=>{const n=w.games.filter(g=>data.completed.includes(g[0])).length;return `<div class="request-row"><span style="font-size:24px">${w.emoji}</span><span class="req-name">${esc(w.name)}</span><span class="pill">${n}/4 missões</span>${data.bosses.includes(w.id)?'<span class="pill approved">Chefão vencido</span>':''}</div>`;}).join('');
 const badgeRows=BADGES.map(b=>{const unlocked=data.badges.includes(b.id);return `<article class="badge-item ${unlocked?'unlocked':''}"><span class="badge-icon">${b.icon}</span><strong>${esc(b.name)}</strong><small>${esc(b.desc)}</small><small>${unlocked?'Conquistada!':'Ainda não conquistada'}</small></article>`;}).join('');
 renderOverlay(`<section class="panel"><button class="close-btn" data-close aria-label="Fechar">✕</button><header class="panel-head"><div class="world-emoji">📖</div><div><h1>Meu Progresso</h1><p>Cada aventura ensina uma coisa nova. Continue no seu ritmo!</p></div></header>
  <div class="world-progress"><span>⭐ ${data.stars} estrelas</span><span>✨ ${data.xp} XP · Nível ${level.level}</span><span>🏅 ${completed}/24 missões</span><span>🎮 ${data.plays} partidas</span><span>👑 ${boss}/6 chefões</span><span>🧩 ${totalUniqueChallenges()} desafios diferentes explorados</span><span>🌈 Banco com ${VARIATION_TARGET}+ variações possíveis</span></div><div class="round-progress" role="progressbar" aria-label="Experiência até o próximo nível" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${level.into}"><span style="width:${level.percent}%"></span></div>
  <div class="parent-section"><h3>Minhas aventuras</h3>${rows}</div><div class="parent-section"><h3>🏆 Coleção de conquistas · ${data.badges.length}/${BADGES.length}</h3><div class="badge-grid">${badgeRows}</div></div><div class="action-row"><button class="primary-btn" data-close-bottom>Continuar brincando</button></div></section>`);
 $('#overlay').querySelector('[data-close]').onclick=closeOverlay;$('#overlay').querySelector('[data-close-bottom]').onclick=closeOverlay;
}
function openSettings(){
 const rows=[
  ['largeText','🔎 Texto maior','Aumenta a leitura dos enunciados e botões.'],
  ['highContrast','🌗 Contraste reforçado','Deixa textos e áreas importantes mais destacados.'],
  ['reduceMotion','🫧 Reduzir animações','Diminui movimentos e transições da interface.']
 ];
 const settingsHtml=rows.map(([key,label,desc])=>`<div class="settings-row"><div><strong>${label}</strong><small>${desc}</small></div><button class="setting-toggle" data-setting="${key}" aria-pressed="${!!data.settings[key]}">${data.settings[key]?'Ligado':'Desligado'}</button></div>`).join('');
 renderOverlay(`<section class="panel"><button class="close-btn" data-close aria-label="Fechar">✕</button><header class="panel-head"><div class="world-emoji">⚙️</div><div><h1>Ajustes da aventura</h1><p>Adapte a experiência para brincar com conforto.</p></div></header><div class="parent-section"><h3>Conforto e acessibilidade</h3>${settingsHtml}</div><div class="parent-section"><h3>Som e narração</h3><div class="settings-row"><div><strong>🔊 Efeitos sonoros</strong><small>Sons de acerto, ritmo e interação.</small></div><button class="setting-toggle" data-audio="sound" aria-pressed="${data.sound}">${data.sound?'Ligado':'Desligado'}</button></div><div class="settings-row"><div><strong>🗣️ Leitura em voz alta</strong><small>O navegador lê as instruções em português.</small></div><button class="setting-toggle" data-audio="voice" aria-pressed="${data.voice}">${data.voice?'Ligado':'Desligado'}</button></div></div><div class="settings-actions"><button class="secondary-btn" data-close-settings>Voltar ao jogo</button></div></section>`);
 const o=$('#overlay');o.querySelector('[data-close]').onclick=closeOverlay;o.querySelector('[data-close-settings]').onclick=closeOverlay;
 o.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{const key=b.dataset.setting;data.settings[key]=!data.settings[key];persist();applySettings();openSettings();});
 o.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>{const key=b.dataset.audio;data[key]=!data[key];persist();if(key==='voice'&&!data.voice&&'speechSynthesis'in window)speechSynthesis.cancel();openSettings();if(key==='sound'&&data.sound)tone(660,.12);});
}
function openShop(){const requests=data.requests.filter(r=>r.status==='pending');const rewards=data.rewards.map(r=>{const pending=requests.some(q=>q.rewardId===r.id);return `<article class="reward-card"><div class="r-emoji">${esc(r.emoji||'🎁')}</div><div class="r-info"><strong>${esc(r.name)}</strong><small>${r.price} estrelas</small></div><button class="small-btn" data-claim="${esc(r.id)}" ${data.stars<r.price||pending?'disabled':''}>${pending?'Aguardando':'Pedir'}</button></article>`}).join('');
 renderOverlay(`<section class="panel"><button class="close-btn" data-close>✕</button><header class="panel-head"><div class="world-emoji">🎁</div><div><h1>Loja do Tesouro</h1><p>Troque estrelas por recompensas especiais. Os pais confirmam os pedidos.</p></div></header><div class="world-progress"><span>⭐ Seu saldo: ${data.stars} estrelas</span><span>Pedidos aguardando: ${requests.length}</span></div><div class="reward-list">${rewards||'<p class="muted">Ainda não há recompensas cadastradas.</p>'}</div><div class="parent-section"><h3>Meus pedidos</h3>${data.requests.length?data.requests.slice().reverse().map(r=>`<div class="request-row"><span class="req-name">${esc(r.rewardName)}</span><span class="pill ${r.status}">${r.status==='pending'?'Aguardando aprovação':r.status==='approved'?'Aprovado':'Não aprovado'}</span></div>`).join(''):'<p class="muted">Você ainda não pediu nenhuma recompensa.</p>'}</div></section>`);
 $('#overlay').querySelector('[data-close]').onclick=closeOverlay;$('#overlay').querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claimReward(b.dataset.claim));
}
function claimReward(id){const reward=data.rewards.find(r=>r.id===id);if(!reward)return;if(data.stars<reward.price){showToast('Você ainda não tem estrelas suficientes.');return;}if(data.requests.some(r=>r.rewardId===id&&r.status==='pending')){showToast('Esse pedido já está aguardando os pais.');return;}data.stars-=reward.price;data.requests.push({id:'req-'+Date.now(),rewardId:id,rewardName:reward.name,price:reward.price,status:'pending',created:new Date().toISOString()});persist();openShop();showToast('Pedido enviado aos pais!');}
function openParents(){ui.parentUnlocked=false;renderOverlay(`<section class="panel"><button class="close-btn" data-close>✕</button><header class="panel-head"><div class="world-emoji">👨‍👩‍👧</div><div><h1>Área dos Pais</h1><p>Espaço protegido para acompanhar e ajustar a aventura.</p></div></header><div class="login-box"><div style="font-size:42px">🔐</div><h3>Digite o PIN dos pais</h3><p class="muted">Primeiro acesso: use 1234 e altere o PIN no painel.</p><input id="parent-pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="PIN dos pais"/><button class="primary-btn" id="parent-login">Entrar</button><p id="pin-error" class="muted" aria-live="polite"></p></div></section>`);
 $('#overlay').querySelector('[data-close]').onclick=closeOverlay;$('#parent-login').onclick=()=>{const pin=$('#parent-pin').value;if(pin===String(data.pin)){ui.parentUnlocked=true;renderParentsDashboard();}else $('#pin-error').textContent='PIN incorreto. Tente novamente.';};$('#parent-pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#parent-login').click();});
}
function renderParentsDashboard(){if(!ui.parentUnlocked){openParents();return;}const pending=data.requests.filter(r=>r.status==='pending');
 const requests=pending.length?pending.map(r=>`<div class="request-row"><span class="req-name">${esc(r.rewardName)} · ${r.price} ⭐</span><button class="small-btn done" data-approve="${esc(r.id)}">Aprovar</button><button class="danger-btn" data-deny="${esc(r.id)}">Recusar</button></div>`).join(''):'<p class="muted">Nenhum pedido aguardando aprovação.</p>';
 const rewardRows=data.rewards.map(r=>`<div class="parent-section"><div class="parent-row"><input data-rname="${esc(r.id)}" value="${esc(r.name)}" aria-label="Nome da recompensa"/><input data-rprice="${esc(r.id)}" type="number" min="1" max="999" value="${r.price}" style="max-width:100px" aria-label="Preço em estrelas"/><button class="small-btn" data-save-reward="${esc(r.id)}">Salvar</button><button class="danger-btn" data-delete-reward="${esc(r.id)}">Excluir</button></div></div>`).join('');
 renderOverlay(`<section class="panel"><button class="close-btn" data-close>✕</button><header class="panel-head"><div class="world-emoji">🛡️</div><div><h1>Painel dos Pais</h1><p>Gerencie recompensas, pedidos e estrelas.</p></div></header><div class="world-progress"><span>⭐ Saldo atual da criança: ${data.stars}</span><span>🏅 ${data.completed.length}/24 missões</span><span>👑 ${data.bosses.length}/6 chefões</span><span>🧩 ${totalUniqueChallenges()} variantes únicas já geradas</span><span>🌈 Banco 500+ variações</span></div><div class="parent-section"><h3>Pedidos de recompensa</h3>${requests}</div><div class="parent-section"><h3>Conceder estrelas</h3><div class="parent-row"><input id="grant-count" type="number" min="1" max="500" placeholder="Quantidade"/><button class="primary-btn" id="grant-btn">Adicionar estrelas</button></div></div><div class="parent-section"><h3>Editar loja de recompensas</h3>${rewardRows}<div class="parent-row"><input id="new-reward-name" placeholder="Nome da nova recompensa"/><input id="new-reward-price" type="number" min="1" max="999" placeholder="Estrelas" style="max-width:115px"/><button class="small-btn" id="add-reward">Adicionar</button></div></div><div class="parent-section"><h3>Segurança</h3><div class="parent-row"><input id="new-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Novo PIN (4 a 8 dígitos)"/><button class="secondary-btn" id="change-pin">Alterar PIN</button></div><p class="muted">O PIN é armazenado neste navegador. Esta área é uma barreira simples para uso familiar, não um sistema de segurança de contas.</p></div><div class="action-row"><button class="secondary-btn" id="parents-done">Fechar painel</button></div></section>`);
 const o=$('#overlay');o.querySelector('[data-close]').onclick=()=>{ui.parentUnlocked=false;closeOverlay();};
 o.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const r=data.requests.find(x=>x.id===b.dataset.approve);if(r){r.status='approved';persist();renderParentsDashboard();}});
 o.querySelectorAll('[data-deny]').forEach(b=>b.onclick=()=>{const r=data.requests.find(x=>x.id===b.dataset.deny);if(r){r.status='denied';data.stars+=r.price;persist();renderParentsDashboard();}});
 o.querySelectorAll('[data-save-reward]').forEach(b=>b.onclick=()=>{const id=b.dataset.saveReward;const r=data.rewards.find(x=>x.id===id);const name=o.querySelector(`[data-rname="${CSS.escape(id)}"]`).value.trim();const price=Number(o.querySelector(`[data-rprice="${CSS.escape(id)}"]`).value);if(!name||!Number.isInteger(price)||price<1){showToast('Informe um nome e um preço válido.');return;}r.name=name;r.price=price;persist();renderParentsDashboard();});
 o.querySelectorAll('[data-delete-reward]').forEach(b=>b.onclick=()=>{data.rewards=data.rewards.filter(x=>x.id!==b.dataset.deleteReward);persist();renderParentsDashboard();});
 $('#grant-btn').onclick=()=>{const n=Number($('#grant-count').value);if(!Number.isInteger(n)||n<1||n>500){showToast('Digite uma quantidade de 1 a 500.');return;}data.stars+=n;persist();renderParentsDashboard();};
 $('#add-reward').onclick=()=>{const name=$('#new-reward-name').value.trim(),price=Number($('#new-reward-price').value);if(!name||!Number.isInteger(price)||price<1){showToast('Preencha o nome e o preço da recompensa.');return;}data.rewards.push({id:'reward-'+Date.now(),name,price,emoji:'🎁'});persist();renderParentsDashboard();};
 $('#change-pin').onclick=()=>{const pin=$('#new-pin').value;if(!/^\d{4,8}$/.test(pin)){showToast('O PIN deve ter de 4 a 8 números.');return;}data.pin=pin;persist();showToast('PIN atualizado com sucesso.');renderParentsDashboard();};
 $('#parents-done').onclick=()=>{ui.parentUnlocked=false;closeOverlay();};
}


document.addEventListener('keydown',e=>{
 const overlay=$('#overlay');if(!overlay||overlay.hidden)return;
 if(e.key==='Escape'){
  e.preventDefault();
  if(overlay.querySelector('.game-panel')){const id=ui.boss?ui.game:gameMeta(ui.game).world.id;clearTaskTimers();if('speechSynthesis'in window)speechSynthesis.cancel();ui.trail=null;ui.trailWorld=null;openWorld(id);}
  else{if(ui.parentUnlocked)ui.parentUnlocked=false;closeOverlay();}
  return;
 }
 if(ui.game==='labirinto'&&!ui.feedback&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
  e.preventDefault();moveMaze(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]);return;
 }
 if(e.key==='Tab'){
  const items=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
  if(!items.length)return;const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===overlay.querySelector('.panel'))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});

// Delegação adicional para os botões de ação criados dentro dos minijogos.
$('#overlay').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 // Os botões dos minijogos recebem também o listener individual em renderGame.
});
if(unlockBadges().length)persist();
applySettings();
renderMap();
</script>
</body>
</html>
